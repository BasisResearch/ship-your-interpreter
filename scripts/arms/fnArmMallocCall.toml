name       = "fnArmMallocCall"
namespace  = "Vsa.Sim"
entry      = 0x800033c4
span_end   = 0x800033cc
terminator = "jal"
callee     = "malloc"
callee_pc  = 0x80004790
imports    = ["Vsa.Sim.DeriveCaseRow", "Vsa.Sim.ChainFactsTac", "Vsa.Sim.BridgeSeg"]
doc        = "FnArmSpec (EX_FN closure-alloc arm) malloc call seam (0x800033c4..0x800033c8): li a0,16 (allocation size = 16-byte closure record) ; sd a3,0(sp) (spill a3 across the call), parked at jal malloc @0x800033cc (allocClosure's backing heap alloc). Frame-free (writes only a0), a bridgeOfSeg row. This arm is the EX_FN jump-table target, reached via jr a5 (NOT fall-through — the closure-call ret path j's PAST it at 0x800033c0). The VAL_CLOSURE build (0x800033d8..0x800033e8: li a5,4 = kind VAL_CLOSURE ; sd s0,0(a0) = env ; sd a3,8(a0) ; sd a0,8(s1) ; sw a5,0(s1)) then materialises the closure Value into the sret before j callJoinPC=0x800033ec."

# entry pins: sp (sd a3,0(sp) spill); a3 (spilled).
[[pin]]
reg = 2
name = "sp"
[[pin]]
reg = 13
name = "a3"
