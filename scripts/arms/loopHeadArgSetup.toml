name       = "loopHeadArgSetup"
namespace  = "Vsa.Sim"
entry      = 0x80004460
span_end   = 0x80004474
terminator = "jal"
callee     = "exec_stmt"
callee_pc  = 0x80003fe0
imports    = ["Vsa.Sim.DeriveCaseRow", "Vsa.Sim.ChainFactsTac", "Vsa.Sim.BridgeSeg"]
doc        = "interp_run exec_stmt arg-setup span [0x80004460, 0x80004474): ld a5,0(sp) (a5 := *sp = interp* pointer) ; addi a3,sp,88 (a3 := &retslot @sp+88) ; mv a1,s1 (a1 := s1 = current Stmt* node) ; ld a2,0(a5) (a2 := *interp = scope/env addr) ; mv a0,a5 (a0 := interp*) ▷ jal exec_stmt @0x80004474 (link 0x80004478). Sets up the four exec_stmt ABI args a0=interp*, a1=Stmt*, a2=env, a3=retslot. Runs AFTER value_null has initialised the retslot buffer at sp+88; reached from the value_null return @0x80004460."

# entry pins: sp (x2, *sp reload + retslot base); s1 (x9, the Stmt* node from the dispatch head).
[[pin]]
reg = 2
name = "sp"
[[pin]]
reg = 9
name = "s1"
